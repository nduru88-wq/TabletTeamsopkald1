<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Ring op</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }
  .call-button {
    background-color: #00ff00;
    color: black;
    font-size: 40px;
    padding: 30px 80px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 30px #00ff00;
  }
  .call-button:active { background-color: #00cc00; }
</style>
</head>
<body>

<button class="call-button" onclick="openChat()">RING OP</button>

<script>
function openChat() {
  const toEmail = "specialminds4@hotmail.com";

  // Prøv at tvinge Teams-appen (Android intent)
  const intentUrl =
    "intent://teams.microsoft.com/l/chat/0/0?users=" + encodeURIComponent(toEmail) +
    "#Intent;scheme=https;package=com.microsoft.teams;end";

  // Backup (nogle gange åbner den i app alligevel)
  const httpsUrl =
    "https://teams.microsoft.com/l/chat/0/0?users=" + encodeURIComponent(toEmail);

  // Ekstra backup: msteams-scheme (virker på nogle enheder)
  const msTeamsUrl =
    "msteams://teams.microsoft.com/l/chat/0/0?users=" + encodeURIComponent(toEmail);

  // Kør i rækkefølge
  window.location.href = intentUrl;
  setTimeout(() => { window.location.href = msTeamsUrl; }, 700);
  setTimeout(() => { window.location.href = httpsUrl; }, 1400);
}
</script>

</body>
</html>
