<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Ring op</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  font-family:Arial, sans-serif;
}

.call-button {
  background:#00ff00;
  color:black;
  font-size:40px;
  padding:30px 80px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 30px #00ff00;
}
</style>
</head>

<body>

<button class="call-button" onclick="startCall()">
RING OP
</button>

<script>
function startCall() {

  const email = "specialminds4@hotmail.com";

  const intentUrl =
    "intent://teams.microsoft.com/l/call/0/0?users=" +
    encodeURIComponent(email) +
    "&withVideo=true" +
    "#Intent;scheme=https;package=com.microsoft.teams;end";

  window.location.href = intentUrl;
}
</script>

</body>
</html>
