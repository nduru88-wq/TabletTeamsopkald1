<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ring op</title>
<style>
  body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial,sans-serif;}
  .call-button{background:#00ff00;color:#000;font-size:40px;padding:30px 80px;border:none;border-radius:20px;cursor:pointer;font-weight:bold;box-shadow:0 0 30px #00ff00;}
  .call-button:active{background:#00cc00;}
</style>
</head>
<body>
<button class="call-button" onclick="startCall()">RING OP</button>

<script>
function startCall(){
  // Robust: tving Teams-appen via intent
  location.href =
    "intent://teams.microsoft.com/l/chat/0/0?users=specialminds3@hotmail.com#Intent;" +
    "scheme=https;" +
    "package=com.microsoft.teams;" +
    "end";
}
</script>
</body>
</html>
